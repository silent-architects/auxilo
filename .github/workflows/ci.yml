name: CI

on:
  push:
  pull_request:

jobs:
  predeploy-guard:
    name: Predeploy Guard (OPS-1 + machine-surface drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The drift guard (scripts/check-surface-drift.sh, invoked by
      # predeploy-check.sh) uses inline `node -e` for JSON parsing, so the
      # job needs Node even though the legal-doc checks are pure bash/grep.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # BLOCKING: fails the build if any served legal doc still contains a
      # `[[...]]` fill-blank (e.g. [[DEPLOY-DATE]], [[LEGAL-ENTITY ...]]), or
      # if the ToS "Current Amendment" id has drifted from the server's
      # CURRENT_TOS_VERSION (Gate-B Condition B), or if any public tool
      # enumeration drifts from mcp-server.js (surplus or missing tools),
      # openapi.json carries a non-canonical path, or the four version
      # strings disagree. See scripts/predeploy-check.sh and
      # scripts/check-surface-drift.sh.
      - name: Run predeploy check
        run: bash scripts/predeploy-check.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # tests/test-mobile-nav-overlay.js Tier-2 (DR-1 regression, PUNCH-LIST
      # §31) needs a real Chromium to drive -- installed here, not committed.
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run tests
        run: npm test
        env:
          # CI_REQUIRE_TIER2=1 makes tests/test-mobile-nav-overlay.js fail
          # the build if playwright is unexpectedly unresolvable here,
          # instead of silently downgrading to Tier-1-only coverage.
          CI_REQUIRE_TIER2: '1'

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit for high/critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high
