name: CI

on:
  push:
  pull_request:

jobs:
  predeploy-guard:
    name: Predeploy Guard (OPS-1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # BLOCKING: fails the build if any served legal doc still contains a
      # `[[...]]` fill-blank (e.g. [[DEPLOY-DATE]], [[LEGAL-ENTITY ...]]), or
      # if the ToS "Current Amendment" id has drifted from the server's
      # CURRENT_TOS_VERSION (Gate-B Condition B). See scripts/predeploy-check.sh.
      - name: Run predeploy check
        run: bash scripts/predeploy-check.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit for high/critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high
