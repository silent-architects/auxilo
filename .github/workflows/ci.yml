name: CI

on:
  push:
  pull_request:

jobs:
  predeploy-guard:
    name: Predeploy Guard (OPS-1 + machine-surface drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The drift guard (scripts/check-surface-drift.sh, invoked by
      # predeploy-check.sh) uses inline `node -e` for JSON parsing, so the
      # job needs Node even though the legal-doc checks are pure bash/grep.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # BLOCKING: fails the build if any served legal doc still contains a
      # `[[...]]` fill-blank (e.g. [[DEPLOY-DATE]], [[LEGAL-ENTITY ...]]), or
      # if the ToS "Current Amendment" id has drifted from the server's
      # CURRENT_TOS_VERSION (Gate-B Condition B), or if any public tool
      # enumeration drifts from mcp-server.js (surplus or missing tools),
      # openapi.json carries a non-canonical path, or the four version
      # strings disagree. See scripts/predeploy-check.sh and
      # scripts/check-surface-drift.sh.
      - name: Run predeploy check
        run: bash scripts/predeploy-check.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    # Generous headroom over the ~10-20s actual runtime — if the runner ever
    # genuinely hangs (see the check-test-count.sh header for why that's not
    # expected here), fail loudly on a timeout instead of stalling the job
    # for hours on GitHub's default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # tests/test-mobile-nav-overlay.js Tier-2 (DR-1 regression, PUNCH-LIST
      # §31) needs a real Chromium to drive -- installed here, not committed.
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # BLOCKING: runs the full node:test suite (test/*.test.js) and fails
      # the build if the discovered/executed test total drifts from the
      # pinned count — catches both silent under-counting (F7c: tests that
      # register/run but never get reported) and an unpinned change in
      # either direction. See scripts/check-test-count.sh for the full
      # root-cause account and the one place to bump the pin.
      - name: Run tests + enforce test-count drift guard
        run: bash scripts/check-test-count.sh

      # The DR-1 mobile-nav regression runs separately (the drift guard
      # deliberately scopes to test/*.test.js only).
      - name: Mobile nav overlay regression (Tier 1 + Tier 2)
        run: node tests/test-mobile-nav-overlay.js
        env:
          # CI_REQUIRE_TIER2=1 makes tests/test-mobile-nav-overlay.js fail
          # the build if playwright is unexpectedly unresolvable here,
          # instead of silently downgrading to Tier-1-only coverage.
          CI_REQUIRE_TIER2: '1'

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit for high/critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  windows-client:
    name: Windows client regression
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Isolated Windows client tests
        shell: pwsh
        run: |
          $testHome = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $testHome | Out-Null
          $env:HOME = $testHome
          $env:AUXILO_HOME = $testHome
          $env:USERPROFILE = $testHome
          $env:APPDATA = Join-Path $testHome 'AppData/Roaming'
          $env:LOCALAPPDATA = Join-Path $testHome 'AppData/Local'
          $env:AUXILO_RUNNER_AUTOUPDATE = '0'
          $env:AUXILO_NO_NOTIFY = '1'
          try {
            node --test test/client-connect-registration.test.js test/client-connect-win32.test.js test/cli-capture-mode-parity.test.js test/cli-binary-resolution.test.js test/spec3-a3-client-port.test.js test/runner-packaging-closure.test.js
            $testExit = $LASTEXITCODE
            if (Test-Path (Join-Path $testHome '.auxilo')) { throw 'Tests left default Auxilo state under the suite home' }
            if ($testExit -ne 0) { exit $testExit }
          } finally {
            Remove-Item -Recurse -Force $testHome
          }
