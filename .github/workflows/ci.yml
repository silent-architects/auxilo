name: CI

on:
  push:
  pull_request:

jobs:
  predeploy-guard:
    name: Predeploy Guard (OPS-1 + machine-surface drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The drift guard (scripts/check-surface-drift.sh, invoked by
      # predeploy-check.sh) uses inline `node -e` for JSON parsing, so the
      # job needs Node even though the legal-doc checks are pure bash/grep.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # BLOCKING: fails the build if any served legal doc still contains a
      # `[[...]]` fill-blank (e.g. [[DEPLOY-DATE]], [[LEGAL-ENTITY ...]]), or
      # if the ToS "Current Amendment" id has drifted from the server's
      # CURRENT_TOS_VERSION (Gate-B Condition B), or if any public tool
      # enumeration drifts from mcp-server.js (surplus or missing tools),
      # openapi.json carries a non-canonical path, or the four version
      # strings disagree. See scripts/predeploy-check.sh and
      # scripts/check-surface-drift.sh.
      - name: Run predeploy check
        run: bash scripts/predeploy-check.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    # Generous headroom over the ~10-20s actual runtime — if the runner ever
    # genuinely hangs (see the check-test-count.sh header for why that's not
    # expected here), fail loudly on a timeout instead of stalling the job
    # for hours on GitHub's default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # BLOCKING: runs the full node:test suite (test/*.test.js) and fails
      # the build if the discovered/executed test total drifts from the
      # pinned count — catches both silent under-counting (F7c: tests that
      # register/run but never get reported) and an unpinned change in
      # either direction. See scripts/check-test-count.sh for the full
      # root-cause account and the one place to bump the pin.
      - name: Run tests + enforce test-count drift guard
        run: bash scripts/check-test-count.sh

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit for high/critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high
