<svg xmlns="http://www.w3.org/2000/svg" width="800" height="32" viewBox="0 0 800 32" preserveAspectRatio="xMidYMid meet">
  <!--
    Section Divider — B-4 Brand Asset
    Horizontal divider with centered Angular A mark and fading gradient lines.
    Full-width friendly via viewBox + preserveAspectRatio.
    Mark: Aurum #C9A84C | Lines: Slate #6B7280 fading to transparent.
  -->
  <defs>
    <!-- Left line gradient: fades from transparent to Slate toward center -->
    <linearGradient id="line-left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6B7280" stop-opacity="0"/>
      <stop offset="100%" stop-color="#6B7280" stop-opacity="1"/>
    </linearGradient>
    <!-- Right line gradient: fades from Slate to transparent away from center -->
    <linearGradient id="line-right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6B7280" stop-opacity="1"/>
      <stop offset="100%" stop-color="#6B7280" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Left fading line -->
  <line
    x1="60" y1="16"
    x2="380" y2="16"
    stroke="url(#line-left)"
    stroke-width="1"
  />

  <!-- Right fading line -->
  <line
    x1="420" y1="16"
    x2="740" y2="16"
    stroke="url(#line-right)"
    stroke-width="1"
  />

  <!--
    Center element: simplified Angular A mark (~18px tall)
    Triangle with extended crossbar, Aurum #C9A84C
  -->
  <g transform="translate(400, 16)">
    <!-- Triangle: 18px tall, proportional to original mark -->
    <polygon
      points="0,-9 8,9 -8,9"
      fill="none"
      stroke="#C9A84C"
      stroke-width="1.2"
      stroke-linejoin="miter"
    />
    <!-- Crossbar extending right -->
    <line
      x1="0" y1="1"
      x2="8" y2="1"
      stroke="#C9A84C"
      stroke-width="1"
    />
  </g>
</svg>
