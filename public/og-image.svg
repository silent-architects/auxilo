<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Import Inter font for text rendering -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;display=swap');
    </style>
  </defs>

  <!-- Background: Obsidian #0A0A0A -->
  <rect width="1200" height="630" fill="#0A0A0A"/>

  <!-- Angular A mark — centered, Aurum #C9A84C -->
  <!-- Scaled version of the favicon SVG: viewBox 0 0 32 32 → scaled to ~160px tall, centered at (600, 220) -->
  <g transform="translate(600, 220)">
    <!-- Triangle: points 16,2 30,28 2,28 → centered at (16,15), scale 6x -->
    <!-- Original centered: (0,-13) (14,13) (-14,13) → scale 5.5x -->
    <polygon 
      points="0,-71.5 77,71.5 -77,71.5" 
      fill="none" 
      stroke="#C9A84C" 
      stroke-width="6" 
      stroke-linejoin="round"
    />
    <!-- Crossbar: original line x1=16 y1=16 x2=30 y2=16 → centered: (0,1) to (14,1) → scale 5.5x -->
    <line 
      x1="0" y1="5.5" 
      x2="77" y2="5.5" 
      stroke="#C9A84C" 
      stroke-width="5"
    />
  </g>

  <!-- Wordmark: "auxilo" in Inter Medium, Ivory #FAFAF8, ~48px -->
  <text 
    x="600" y="370" 
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
    font-weight="500" 
    font-size="48" 
    fill="#FAFAF8" 
    text-anchor="middle" 
    letter-spacing="-0.02em"
  >auxilo</text>

  <!-- Tagline: "The Discovery Layer for the Agent Economy" in Slate #6B7280, ~20px -->
  <text 
    x="600" y="410" 
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
    font-weight="400" 
    font-size="20" 
    fill="#6B7280" 
    text-anchor="middle" 
    letter-spacing="0.01em"
  >The Discovery Layer for the Agent Economy</text>
</svg>
